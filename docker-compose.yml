services:
  api:
    build:
      context: .
      target: dev
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/invitely?sslmode=disable
      DEV_WATCH_INTERVAL: 1
    volumes:
      - .:/app
      - go_pkg_mod:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    command: sh ./scripts/dev-watch.sh
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: invitely
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d invitely"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  go_pkg_mod:
  go_build_cache:
